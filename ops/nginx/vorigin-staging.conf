# VOrigin staging canary origin: loopback-only on port 8081.
server {
    listen 127.0.0.1:8081 default_server;
    server_name staging.vorigin.vn staging.local localhost 127.0.0.1;
    server_tokens off;
    absolute_redirect off;

    root /srv/vorigin/staging/current;
    index index.html;
    charset utf-8;

    # Security headers matching production policy. CSP explicitly permits Cloudflare Turnstile only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 20s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /vi/;
    }

    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Never serve hidden/source/config files if accidentally copied.
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:env|ini|log|sql|bak|md|json)$ { deny all; }
}
