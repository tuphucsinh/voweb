# Cloudflare country routing for the bare-root locale choice. All non-VN values
# intentionally fall back to English; explicit /vi/ and /en/ routes are manual.
map $http_cf_ipcountry $root_locale {
    default en;
    VN      vi;
}

# Canonical public host: Cloudflare serves HTTPS at the edge.
server {
    listen 127.0.0.1:8080;
    server_name www.vorigin.vn;
    server_tokens off;
    return 301 https://vorigin.vn$request_uri;
}

# VOrigin public origin: intentionally loopback-only. Cloudflare Tunnel connects to 127.0.0.1:8080.
server {
    listen 127.0.0.1:8080 default_server;
    server_name vorigin.vn localhost;
    server_tokens off;
    absolute_redirect off;

    root /srv/vorigin/current;
    index index.html;
    charset utf-8;

    # Security headers. CSP explicitly permits Cloudflare Turnstile only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; upgrade-insecure-requests" always;
    # Safe because the public hostname is intended to be HTTPS-only via Cloudflare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    keepalive_timeout 20s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        # add_header is repeated here because Nginx does not inherit parent
        # add_header directives once a child location declares any of them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header Vary "CF-IPCountry" always;
        return 302 /$root_locale/;
    }

    location /api/lead {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787/api/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
        proxy_buffering off;
    }

    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Never serve hidden/source/config files if accidentally copied.
    location ~ (^|/)\. { deny all; }
    location ~* \.(?:env|ini|log|sql|bak|md|json)$ { deny all; }
}
